[project]
name = "wrkhorse"
version = "0.1.0"
description = "MCP queue and a separate coding worker for a local pilot"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.scripts]
wrkhorse = "wrkhorse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wrkhorse*"]
